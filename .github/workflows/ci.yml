name: CI - Simulation & Backend Quality Assurance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. SIMULATOR TEST MATRIX (NODE.JS & E2E) ──────────────────────────────
  simulator-tests:
    name: Simulator Tests (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        node-version: [ '18.x', '20.x', '22.x' ]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install root dependencies
        run: npm install

      - name: 📦 Install simulator sub-package dependencies
        run: |
          cd datasets/f1-simulator
          npm install

      - name: 🚀 Start Simulator Server (Linux Background)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node datasets/f1-simulator/server.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          echo "Simulator server initiated in background (PID: $!). Waiting for /health..."
          
          # Poll /health until server is responsive (max 30s)
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8765/health | grep -q '"status":"healthy"'; then
              echo "✅ Simulator server is healthy on http://127.0.0.1:8765/health"
              break
            fi
            sleep 1
          done

      - name: 🏎️ Run All 49 Simulator Test Suites
        run: npm test

      - name: 🛑 Teardown Server
        if: always()
        shell: bash
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

  # ─── 2. PYTHON ML & FASTAPI BACKEND VALIDATION ─────────────────────────────
  python-backend:
    name: Python API & ML Engine (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12' ]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Compile & Validate Python Scripts
        run: |
          python -m py_compile api.py f1_draft_sim.py f1_model.py f1_data.py

      - name: 🧪 Execute FastAPI & ML Engine Smoke Test
        run: |
          python -c "import api; print('FastAPI app initialized:', api.app.title)"

  # ─── 3. CODE INTEGRITY, SECURITY & CONFIG AUDIT ───────────────────────────
  code-integrity-audit:
    name: Code Integrity & Configuration Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 🔍 Validate JSON Data Integrity
        run: |
          node -e "
            const fs = require('fs');
            const files = ['package.json', 'datasets/f1-simulator/package.json', 'driver_ratings.json'];
            files.forEach(f => {
              JSON.parse(fs.readFileSync(f, 'utf8'));
              console.log('✓ Valid JSON:', f);
            });
          "

      - name: 🛡️ Audit NPM Dependencies (Advisory)
        run: npm audit --audit-level=high || true

      - name: 📋 Verify Cloud Deployment Blueprint (render.yaml)
        run: |
          node -e "
            const fs = require('fs');
            const content = fs.readFileSync('render.yaml', 'utf8');
            if (!content.includes('name: f1-simulator') || !content.includes('name: f1-draft-sim')) {
              throw new Error('render.yaml missing mandatory service declarations');
            }
            console.log('✓ render.yaml configuration validated');
          "
