version: 2
updates:
  # Maintain root Node.js dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain simulator sub-package dependencies
  - package-ecosystem: "npm"
    directory: "/datasets/f1-simulator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain Python requirements
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
